<script>
  // Accordion Logic
  const toggles = document.querySelectorAll('.faq-toggle');
  toggles.forEach(toggle => {
    toggle.addEventListener('click', () => {
      const content = toggle.nextElementSibling;
      const arrow = toggle.querySelector('.material-symbols-outlined:last-child');
      const isExpanded = !content.classList.contains('hidden');

      // Close all other accordions for compact clean view
      document.querySelectorAll('.faq-content').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.faq-toggle .material-symbols-outlined:last-child').forEach(a => a.classList.remove('rotate-180'));

      if (!isExpanded) {
        content.classList.remove('hidden');
        arrow.classList.add('rotate-180');
      }
    });
  });

  // Dynamic FAQ Search
  const searchInput = document.getElementById('faq-search');
  const clearBtn = document.getElementById('search-clear-btn');
  const faqItems = document.querySelectorAll('.faq-item');

  searchInput.addEventListener('input', (e) => {
    const val = e.target.value.toLowerCase().trim();
    if (val.length > 0) {
      clearBtn.classList.remove('opacity-0', 'pointer-events-none');
    } else {
      clearBtn.classList.add('opacity-0', 'pointer-events-none');
    }

    faqItems.forEach(item => {
      const text = item.textContent.toLowerCase();
      if (text.includes(val)) {
        item.classList.remove('hidden');
      } else {
        item.classList.add('hidden');
      }
    });
  });

  clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.add('opacity-0', 'pointer-events-none');
    faqItems.forEach(item => item.classList.remove('hidden'));
    searchInput.focus();
  });

  // Diagnostic Logs Dispatch Simulation
  const sendLogsBtn = document.getElementById('send-logs-btn');
  const logAlert = document.getElementById('logs-success-alert');
  const anonIdEl = document.getElementById('anon-log-id');

  sendLogsBtn.addEventListener('click', () => {
    sendLogsBtn.disabled = true;
    sendLogsBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span><span>Transmission en cours...</span>';

    setTimeout(() => {
      const randomHex = Math.floor(1000 + Math.random() * 9000);
      anonIdEl.innerText = '#SN-REGTEST-' + randomHex;
      sendLogsBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">done_all</span><span>Logs envoyés</span>';
      sendLogsBtn.classList.remove('bg-surface-container-highest');
      sendLogsBtn.classList.add('bg-surface-container');
      logAlert.classList.remove('hidden');
      logAlert.classList.add('flex');
    }, 900);
  });
</script><style>
