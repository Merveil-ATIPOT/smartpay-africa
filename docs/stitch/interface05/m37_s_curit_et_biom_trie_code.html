        <button type="button" class="autolock-opt p-3 rounded-lg bg-surface-container-low hover:bg-surface-container text-on-surface flex flex-col items-start gap-1 transition-all text-left">
          <div class="flex items-center justify-between w-full">

            <span class="material-symbols-outlined text-[18px] opacity-0">check_circle</span>

          <span class="font-label-badge text-label-badge text-on-surface-variant">Déconseillé</span>

  <!-- Section: Sessions actives & Appareils -->
  <div class="px-margin mt-6 mb-2">
    <div class="flex items-center justify-between mb-2">

      <span class="font-label-badge text-label-badge bg-surface-container px-2 py-0.5 rounded-full text-on-surface">2 Appareils</span>
    </div>

    <div class="bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden flex flex-col">
      <!-- Session 1: Current device -->
      <div class="p-space-md flex items-center justify-between">
        <div class="flex items-center gap-space-sm min-w-0">
          <div class="relative w-10 h-10 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 text-on-surface">
            <span class="material-symbols-outlined text-[20px]">smartphone</span>
            <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-on-tertiary-container ring-2 ring-surface-container-lowest"></span>
          </div>
          <div class="flex flex-col min-w-0">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="font-body-lg text-body-lg text-on-surface font-semibold truncate">iPhone 15 Pro</span>
              <span class="font-label-badge text-label-badge bg-tertiary-fixed text-on-tertiary-fixed px-1.5 py-0.2 rounded font-medium">Cet appareil</span>

            <span class="font-body-sm text-body-sm text-on-surface-variant truncate">Dakar, SN · Actif maintenant (IP 196.207.*.*)</span>

      <div class="h-px bg-surface-container mx-space-md"></div>

      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-tertiary-fixed text-[20px]">check_circle</span>
        <span id="toastMessage" class="font-body-sm text-body-sm">Action enregistrée</span>
      </div>
      <button type="button" onclick="dismissToast()" class="text-on-primary-container hover:text-on-primary">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>

<script>
  // Toast notification helper
  function triggerToast(msg) {
    const toast = document.getElementById('toastNotification');
    const label = document.getElementById('toastMessage');
    if (!toast || !label) return;
    label.textContent = msg;
    toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');
    setTimeout(() => {
      dismissToast();
    }, 3200);
  }

  function dismissToast() {
    const toast = document.getElementById('toastNotification');
    if (toast) {
      toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }
  }

  // Toggle Mnemonic Reveal
  const showBtn = document.getElementById('showSeedBtn');
  const hideBtn = document.getElementById('hideSeedBtn');
  const seedBox = document.getElementById('seedDisplayBox');

  if (showBtn && hideBtn && seedBox) {
    showBtn.addEventListener('click', () => {
      seedBox.classList.remove('hidden');
      seedBox.classList.add('flex');
      showBtn.classList.add('hidden');
      triggerToast('Phrase révélée : assurez-vous d\'être à l\'abri des regards.');
    });

    hideBtn.addEventListener('click', () => {
      seedBox.classList.add('hidden');
      seedBox.classList.remove('flex');
      showBtn.classList.remove('hidden');
    });
  }

  // Auto-lock radio behavior
  const autoLockButtons = document.querySelectorAll('.autolock-opt');
  autoLockButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      autoLockButtons.forEach(b => {
        b.classList.remove('bg-surface-container-high');
        b.classList.add('bg-surface-container-low');
        const icon = b.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.add('opacity-0');
          icon.classList.remove('text-secondary');
        }
      });
      btn.classList.add('bg-surface-container-high');
      btn.classList.remove('bg-surface-container-low');
      const icon = btn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.classList.remove('opacity-0');
        icon.classList.add('text-secondary');
      }
      triggerToast('Délai de verrouillage mis à jour');
    });
  });

  // Disconnect other sessions button
  const disconnectBtn = document.getElementById('disconnectOthersBtn');
  if (disconnectBtn) {
    disconnectBtn.addEventListener('click', () => {
      triggerToast('Toutes les autres sessions distantes ont été révoquées.');
    });
  }

  // Biometry toggle feedback
  const bioToggle = document.getElementById('biometryToggle');
  if (bioToggle) {
    bioToggle.addEventListener('change', (e) => {
      if (e.target.checked) {
        triggerToast('Biométrie activée pour le déverrouillage et micropaiements.');
      } else {
        triggerToast('Biométrie désactivée. Code PIN requis pour toute action.');
      }
    });
  }
</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
