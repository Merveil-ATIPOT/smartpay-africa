      btn.setAttribute('aria-checked', 'false');
      btn.className = 'w-12 h-7 bg-surface-container-highest rounded-full p-1 transition-colors duration-200 ease-in-out flex items-center justify-start flex-shrink-0';
      thumb.className = 'w-5 h-5 bg-on-surface-variant rounded-full shadow-md transition-transform duration-200';
    } else {
      btn.setAttribute('aria-checked', 'true');
      btn.className = 'w-12 h-7 bg-secondary-container rounded-full p-1 transition-colors duration-200 ease-in-out flex items-center justify-end flex-shrink-0';
      thumb.className = 'w-5 h-5 bg-on-secondary rounded-full shadow-md transition-transform duration-200';
    }
  }

  function selectBtcUnit(unit) {
    const btnSats = document.getElementById('btn-unit-sats');
    const btnBtc = document.getElementById('btn-unit-btc');

    if (unit === 'sats') {
      btnSats.className = 'flex flex-col p-3 rounded-xl bg-surface-container-high text-left transition-all relative shadow-sm';
      btnSats.querySelector('.material-symbols-outlined').textContent = 'check_circle';
      btnSats.querySelector('.material-symbols-outlined').className = 'material-symbols-outlined text-secondary-container text-[20px]';
      btnSats.querySelector('.material-symbols-outlined').style = "font-variation-settings: 'FILL' 1;";

      btnBtc.className = 'flex flex-col p-3 rounded-xl bg-surface-container-low text-left opacity-75 transition-all relative';
      btnBtc.querySelector('.material-symbols-outlined').textContent = 'radio_button_unchecked';
      btnBtc.querySelector('.material-symbols-outlined').className = 'material-symbols-outlined text-outline-variant text-[20px]';
      btnBtc.querySelector('.material-symbols-outlined').style = '';
    } else {
      btnBtc.className = 'flex flex-col p-3 rounded-xl bg-surface-container-high text-left transition-all relative shadow-sm';
      btnBtc.querySelector('.material-symbols-outlined').textContent = 'check_circle';
      btnBtc.querySelector('.material-symbols-outlined').className = 'material-symbols-outlined text-secondary-container text-[20px]';
      btnBtc.querySelector('.material-symbols-outlined').style = "font-variation-settings: 'FILL' 1;";

      btnSats.className = 'flex flex-col p-3 rounded-xl bg-surface-container-low text-left opacity-75 transition-all relative';
      btnSats.querySelector('.material-symbols-outlined').textContent = 'radio_button_unchecked';
      btnSats.querySelector('.material-symbols-outlined').className = 'material-symbols-outlined text-outline-variant text-[20px]';
      btnSats.querySelector('.material-symbols-outlined').style = '';
    }
  }

  function updateFiatRate(val) {
    const tag = document.getElementById('fiat-rate-tag');
    if (val === 'XOF') {
      tag.textContent = '1 sat ≈ 0,58 FCFA (Taux de change indicatif Regtest)';
    } else if (val === 'USD') {
      tag.textContent = '1 sat ≈ $0,00095 USD (Taux de change indicatif Regtest)';
    } else if (val === 'EUR') {
      tag.textContent = '1 sat ≈ €0,00088 EUR (Taux de change indicatif Regtest)';
    }
  }

  function selectTheme(mode) {
    const modes = ['light', 'dark', 'auto'];
    modes.forEach(m => {
      const btn = document.getElementById('theme-btn-' + m);
      const icon = btn.querySelector('.material-symbols-outlined');
      const text = btn.querySelector('.font-body-sm');
      const sub = btn.querySelector('.font-label-badge');

      if (m === mode) {
        btn.className = 'flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-surface-container-high transition-all shadow-sm';
        icon.className = 'material-symbols-outlined text-secondary-container text-[24px] mb-1';
        text.className = 'font-body-sm text-body-sm font-semibold text-on-surface';
        sub.className = 'font-label-badge text-label-badge text-secondary font-semibold mt-0.5 opacity-100';
        sub.textContent = 'Actif';
      } else {
        btn.className = 'flex flex-col items-center justify-center py-3 px-2 rounded-xl bg-surface-container-low transition-all';
        icon.className = 'material-symbols-outlined text-on-surface-variant text-[24px] mb-1';
        text.className = 'font-body-sm text-body-sm font-semibold text-on-surface-variant';
        sub.className = 'font-label-badge text-label-badge text-on-surface-variant mt-0.5 opacity-0';
        sub.textContent = '·';
      }
    });
  }

  function savePreferences() {
    const toast = document.getElementById('save-toast');
    toast.classList.remove('hidden');
    setTimeout(() => {
      toast.classList.add('hidden');
    }, 2800);
  }
