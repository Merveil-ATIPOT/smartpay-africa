    </button>

<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const icon = document.getElementById('password-visibility-icon');
    if (!pwdInput || !icon) return;
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function prefillDemoUser() {
    const idInput = document.getElementById('identifier-input');
    const pwdInput = document.getElementById('password-input');
    if (idInput && pwdInput) {
      idInput.value = 'amadou@smartpay.africa';
      pwdInput.value = 'LightningRegtest2025!';
      idInput.classList.add('bg-surface-container');
      setTimeout(() => idInput.classList.remove('bg-surface-container'), 400);
    }
  }

  function toggleSwitch(btn) {
    const isChecked = btn.getAttribute('aria-checked') === 'true';
    const knob = btn.firstElementChild;
    if (isChecked) {
      btn.setAttribute('aria-checked', 'false');
      btn.classList.remove('bg-secondary-container');
      btn.classList.add('bg-outline-variant');
      knob.classList.remove('translate-x-5');
      knob.classList.add('translate-x-0');
      knob.innerHTML = '';
    } else {
      btn.setAttribute('aria-checked', 'true');
      btn.classList.add('bg-secondary-container');
      btn.classList.remove('bg-outline-variant');
      knob.classList.add('translate-x-5');
      knob.classList.remove('translate-x-0');
      knob.innerHTML = '<span class="material-symbols-outlined text-[14px] text-on-secondary-container">check</span>';
    }
  }

  function simulateBiometrics() {
    prefillDemoUser();
    const btn = document.getElementById('submit-login');
    if (btn) {
      btn.classList.add('scale-[0.98]');
      setTimeout(() => {
        btn.classList.remove('scale-[0.98]');
        btn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">refresh</span><span>Vérification...</span>';
        setTimeout(() => {
          btn.innerHTML = '<span>Succès ! Redirection...</span><span class="material-symbols-outlined text-[22px]">check_circle</span>';
        }, 800);
      }, 300);
    }
  }

  function handleLogin() {
    const btn = document.getElementById('submit-login');
    if (!btn) return;
    btn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">refresh</span><span>Connexion...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span>Connecté !</span><span class="material-symbols-outlined text-[22px]">bolt</span>';
    }, 700);
  }
</script></main></body></html>
