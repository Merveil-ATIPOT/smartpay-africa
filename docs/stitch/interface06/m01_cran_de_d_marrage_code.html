<script>
  (function() {
    const steps = [
      { text: "Connexion au n\u0153ud LND...", pct: "34%", width: "34%" },
      { text: "Initialisation des canaux de paiement...", pct: "68%", width: "68%" },

      { text: "Pr\u00eat ! Bienvenue sur SmartPay.", pct: "100%", width: "100%" }
    ];
    let index = 1;
    const textEl = document.getElementById("splash-status-text");
    const pctEl = document.getElementById("splash-percent");
    const barEl = document.getElementById("splash-progress-bar");

    if (textEl && pctEl && barEl) {
      setInterval(() => {
        index = (index + 1) % steps.length;
        textEl.textContent = steps[index].text;
        pctEl.textContent = steps[index].pct;
        barEl.style.width = steps[index].width;
      }, 2400);
    }
  })();
