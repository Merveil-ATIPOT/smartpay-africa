openapi: 3.0.3
info:
  title: SmartPay Africa API
  version: 0.2.0
  description: |
    API P01. Bitcoin Regtest uniquement.
    Le fournisseur Mock ne produit jamais un règlement Lightning.
    Aucune conversion FCFA réelle. Aucun Wave / Orange Money / MTN réel.
servers:
  - url: http://localhost:8000
    description: Développement local
paths:
  /api/v1/health/:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: Service disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Base de données indisponible
  /api/v1/me/:
    get:
      operationId: getMe
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profil courant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Non authentifié
  /api/v1/wallet/:
    get:
      operationId: getWallet
      tags: [wallets]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Connexion portefeuille Mock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletConnection"
  /api/v1/payments/:
    get:
      operationId: listPayments
      tags: [payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Paiements du propriétaire (ou tous pour un admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
    post:
      operationId: createPayment
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Paiement Mock créé (non Lightning)
        "200":
          description: Rejeu idempotent
  /api/v1/payments/{id}/:
    get:
      operationId: getPayment
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "403":
          description: Accès refusé
  /api/v1/payments/invoices/:
    post:
      operationId: createInvoice
      tags: [payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceRequest"
      responses:
        "201":
          description: Facture Mock (préfixe mockln1, pas une facture BOLT11 réelle)
  /api/v1/payments/preview/:
    post:
      operationId: previewPayment
      tags: [payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewPaymentRequest"
      responses:
        "200":
          description: Aperçu Mock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPreview"
  /api/v1/transfers/simulations/:
    get:
      operationId: listTransferSimulations
      tags: [transfers]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Simulations uniquement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferSimulationList"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        version:
          type: string
        network:
          type: string
          enum: [regtest]
        payment_provider:
          type: string
          enum: [mock]
        lightning:
          type: string
          enum: [not_connected, regtest]
        database:
          type: string
          enum: [up, down]
        checked_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        role:
          type: string
          enum: [individual, student, merchant, business, admin]
        country:
          type: string
          enum: [SN, CG, CI]
        is_active:
          type: boolean
        date_joined:
          type: string
          format: date-time
    WalletConnection:
      type: object
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [mock, lnd_regtest]
        public_identifier:
          type: string
        node_pubkey:
          type: string
        alias:
          type: string
        is_active:
          type: boolean
        mock_balance_sats:
          type: integer
          minimum: 0
        is_lightning_connected:
          type: boolean
        connected_at:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    PaymentInvoice:
      type: object
      properties:
        encoded_invoice:
          type: string
        payment_hash:
          type: string
        memo:
          type: string
        expires_at:
          type: string
          format: date-time
        is_mock:
          type: boolean
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount_sats:
          type: integer
          minimum: 1
        description:
          type: string
        status:
          type: string
          enum: [created, pending, confirmed, failed, expired]
        settlement_mode:
          type: string
          enum: [mock, lightning_regtest]
        is_lightning_settled:
          type: boolean
        lightning_status:
          type: string
          enum: [not_applicable, settled]
        network:
          type: string
          enum: [regtest]
        direction:
          type: string
          enum: [incoming, outgoing]
        warnings:
          type: array
          items:
            type: string
    PaymentList:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
    CreateInvoiceRequest:
      type: object
      required: [amount_sats]
      properties:
        amount_sats:
          type: integer
          minimum: 1
        memo:
          type: string
        expiry_seconds:
          type: integer
          minimum: 60
          maximum: 86400
    PreviewPaymentRequest:
      type: object
      required: [amount_sats]
      properties:
        amount_sats:
          type: integer
          minimum: 1
        description:
          type: string
    CreatePaymentRequest:
      type: object
      required: [amount_sats]
      properties:
        amount_sats:
          type: integer
          minimum: 1
        description:
          type: string
        merchant_id:
          type: integer
        idempotency_key:
          type: string
        encoded_invoice:
          type: string
          description: Facture BOLT11 Regtest (lnbcrt…). Obligatoire si PAYMENT_PROVIDER=lnd_regtest.
        confirm:
          type: boolean
          default: true
          description: Confirmation explicite du paiement. POST /payments/ est l'acte de confirmation.
    PaymentPreview:
      type: object
      properties:
        amount_sats:
          type: integer
        fee_sats:
          type: integer
        settlement_mode:
          type: string
        network:
          type: string
        is_lightning_settled:
          type: boolean
        warnings:
          type: array
          items:
            type: string
    TransferSimulation:
      type: object
      properties:
        id:
          type: integer
        source_country:
          type: string
          enum: [SN, CG, CI]
        destination_country:
          type: string
          enum: [SN, CG, CI]
        amount_sats:
          type: integer
        status:
          type: string
          enum: [created, pending, confirmed, failed, expired]
        disclaimer:
          type: string
        created_at:
          type: string
          format: date-time
    TransferSimulationList:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/TransferSimulation"
