[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
# Conteneur API (DJANGO_SETTINGS_MODULE=development dans l'env) :
# docker exec -e DJANGO_SETTINGS_MODULE=config.settings.test smartpay-api python -m pytest
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --reuse-db
markers =
    lnd: tests d'intégration Bitcoin Lightning Regtest (laboratoire Docker)
filterwarnings =
    ignore::DeprecationWarning
